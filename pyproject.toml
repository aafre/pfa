[project]
name = "pfa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.35.3",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "rich>=13.9.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[project.scripts]
pfa = "pfa.cli.app:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
